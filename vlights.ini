# VLights - config
# Lives next to VLights.asi. Press the reload key in-game to
# re-read it, or use the in-game menu (menu key) and Save.

enabled = 1

# Colours are 'R G B' (0-255) or '#RRGGBB'.
# source: the colour being hunted (only its hue is used).
source = 255 147 41
# target: what matching lights become.
target = 235 240 255

# A light matches when its hue is within hue_window degrees of source's
# hue AND its saturation is at least min_saturation (0-1). Vanilla sodium
# street lights decode to hue 17-30 with saturation 0.75-1.0; warm amber
# signage sits at hue 36-45 / saturation 0.35-0.6; whites are ~0.1.
hue_window = 13.00
min_saturation = 0.60

# Second match zone for the cream freeway lamps (prop_streetlight_06/_08,
# light colour 255 227 166: hue 41, saturation 0.35). A saturation ceiling
# keeps amber runway lights (hue 44, saturation 0.99) out of it.
match_cream = 1
source2 = 255 227 166
hue_window2 = 14.00
min_saturation2 = 0.30
max_saturation2 = 0.70

# Third match zone for the teal 'cool' lamps (prop_streetlight_01b, light
# colour 120 255 232: hue 170, saturation 0.53).
match_cool = 1
source3 = 120 255 232
hue_window3 = 15.00
min_saturation3 = 0.30
max_saturation3 = 0.80

# all_streetlights: every light on a model whose name contains one of
# streetlight_names, and every LOD entry the map flags as a street light,
# takes the target colour whatever its original colour (white, teal, pale
# blue variants included). 0 = only colours the zones above match.
all_streetlights = 1
streetlight_names = streetlight
# streetlight_models: archetype names whose map placements also get their
# per-placement light overrides forced. Models loaded with a streetlight
# name are added on the fly; list extras here.
streetlight_models = prop_streetlight_01, prop_streetlight_01b, prop_streetlight_02, prop_streetlight_03, prop_streetlight_03b, prop_streetlight_03c, prop_streetlight_03d, prop_streetlight_03e, prop_streetlight_04, prop_streetlight_05, prop_streetlight_05_b, prop_streetlight_06, prop_streetlight_07a, prop_streetlight_07b, prop_streetlight_08, prop_streetlight_09, prop_streetlight_10, prop_streetlight_11a, prop_streetlight_11b, prop_streetlight_11c, prop_streetlight_12a, prop_streetlight_12b, prop_streetlight_14a, prop_streetlight_15a, prop_streetlight_16a, prop_streetlight_16b

# blend: 1 = replace with target, 0.5 = halfway, 0 = leave untouched.
blend = 1.00
# keep_brightness: scale target so each light keeps its own brightness
# instead of every light becoming identical.
keep_brightness = 1

# near_enabled: also recolour near-tier lights (the light definitions baked
# into lamp-post models and the per-entity light overrides stored in map
# blocks), using the same match and target. 0 = LOD/distant lights only.
# Takes effect at game start (hooks are installed then). Near lights take
# a new colour as they stream in again, not instantly.
near_enabled = 1
# textures: also recolour the lantern glow baked into lamp textures (the
# emissive lens), with the same match and target. Hook installs at game
# start; colour changes repaint these live.
textures = 1
# texture_names: comma-separated name fragments; only textures whose name
# contains one are touched (keeps amber car indicators and signs alone).
texture_names = streetlight, wall_light, lamppost, lamp_post, ind_light, oldlight
# texture_exclude: name fragments that are never recoloured even if they
# match texture_names (rsn_ = Rockstar sign artwork such as
# rsn_os_streetlight_orange).
texture_exclude = rsn_
# texture_force: lens textures retinted wholesale, every pixel toward the
# target with its brightness kept, because their colour is a faint tint no
# zone can pick out (prop_streetlight_01_bulb is grey-green at saturation
# 0.1-0.2). Needs all_streetlights = 1.
texture_force = prop_streetlight_01_bulb

# Diagnostics (written to vlights.log next to the .asi).
# debug: master switch. With 0 nothing below is logged during play, whatever
# the individual keys say. Leave at 0 unless investigating: per-object
# logging costs frame time while models stream in.
debug = 0
# log_samples: log the first N raw entries seen, with their decoded
# colour. log_blocks: one line per map data block with counts.
log_samples = 0
log_blocks = 0
# near_log: one line per model / map block that has lights, with colours.
near_log = 0
# probe: 'x y radius'. With debug on, every map block that streams in is
# scanned and its entities / LOD lights within radius of that world point
# are logged (model hash, extensions, original colour). 0 0 = off.
probe = 0.00 0.00 25.00

# update_check: once at startup, ask api.github.com for the latest release
# and show a notice in the menu if it is newer. Nothing is downloaded or
# installed, nothing else is sent. 0 = never contact anything.
update_check = 1

# Hotkeys: F1-F24, or a hex/decimal virtual-key code. 0 disables.
# reload_key re-reads this file and repaints loaded lights.
# menu_key toggles the in-game menu.
reload_key = F9
menu_key = F10

# live_repaint: remember loaded blocks so reload/menu changes repaint them
# instantly (detours the ymap store's Remove; no vtable writes). 0 = off,
# changes then apply only to blocks that stream in later.
live_repaint = 1
